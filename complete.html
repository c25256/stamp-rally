<!-- complete.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スタンプコンプリート！</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #6c5ce7;
      color: white;
      font-family: "Segoe UI", sans-serif;
      text-align: center;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      animation: fadeIn 1s ease-in-out;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 100px;
      text-shadow: 10px 10px 50px rgba(0, 0, 0, 0.5);
    }

    #datetime {
      font-size: 2.0em;
      margin-top: 80px;
    }

    button {
      background-color: #ff8a65;
      border: none;
      padding: 40px 50px;
      color: white;
      font-size: 1.7em;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s;
      margin-top: 50px;
    }

    button:hover {
      background-color: #f6d365;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body onload="showFixedDateTime()">
  <h1>🎉 スタンプコンプリート！ 🎉</h1>
  <img src="waribiki.png" alt="割引券" />
  
  <!-- 固定した日付と時刻を表示 -->
  <p id="datetime"></p>

  <button onclick="window.location.href='index.html'">スタンプカードへ戻る</button>

  <script>
    function showFixedDateTime() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const formatted = `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
      document.getElementById("datetime").textContent =
        `取得日時：${formatted}`;
    }
  </script>
</body>
</html>
